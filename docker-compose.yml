services:
  backend:
    build:
      context: ./architecture/backend
      dockerfile: Dockerfile
    image: myapp-backend:latest
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: myapp-frontend:latest
    ports:
      - "80:80"
    # this serves the static `index.html`; extend to a full React build later

    # depends_on:
    #   - backend # if the frontend needs to wait for the API

